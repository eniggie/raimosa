<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07030D" />
    <title>RAIMOSA AI — Initializing</title>
    <link rel="icon" href="../favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="../favicon/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="./splash.css" />
  </head>
  <body>
    <main class="splash" aria-label="RAIMOSA AI is initializing">
      <img class="splash__backdrop" src="./assets/command-nexus-background.png" alt="" />
      <div class="splash__veil" aria-hidden="true"></div>
      <div class="splash__scan" aria-hidden="true"></div>
      <div class="orbit orbit--outer" aria-hidden="true"></div>
      <div class="orbit orbit--inner" aria-hidden="true"></div>
      <div class="beam" aria-hidden="true"></div>

      <section class="identity" aria-live="polite">
        <div class="sigil-stage" aria-hidden="true">
          <div class="sigil-aura"></div>
          <img class="sigil" src="../logo/raimosa-r-capabilities-transparent-tight.png" alt="" />
          <span class="capability-pulse capability-pulse--observe"></span>
          <span class="capability-pulse capability-pulse--coordinate"></span>
          <span class="capability-pulse capability-pulse--execute"></span>
          <span class="capability-pulse capability-pulse--report"></span>
          <span class="capability-pulse capability-pulse--automate"></span>
          <span class="capability-pulse capability-pulse--protect"></span>
        </div>

        <h1 class="wordmark"><span>RAIMOSA</span><b>AI</b></h1>
        <p class="tagline">Command Your World With Intelligence</p>
        <div class="command-line" aria-hidden="true">
          <span>Observe</span><i></i><span>Coordinate</span><i></i><span>Execute</span><i></i><span>Report</span><i></i><span>Automate</span><i></i><span>Protect</span>
        </div>
      </section>

      <p class="system-status"><span class="status-dot"></span><span>Command intelligence online</span></p>
    </main>
    <script src="./splash.js"></script>
  </body>
</html>
